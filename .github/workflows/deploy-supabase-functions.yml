# Deploys the Supabase Edge Functions whenever they change on main.
# Needs one repo secret: SUPABASE_ACCESS_TOKEN (a personal access token from
# https://supabase.com/dashboard/account/tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jpuzfptdrlotbsgsiphs
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
          done
