<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US Navy Fleet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a1520; --land:#1d2e3d; --landline:#2c4256; --grat:#132433; --panel:#12212f; --line:#24384b;
          --text:#e6edf3; --muted:#8aa0b4; --ais:#00e5a0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
              font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map, #map svg { position:absolute; inset:0; touch-action:none; -webkit-user-select:none; user-select:none; }
  #map svg { width:100%; height:100%; display:block; cursor:grab; }
  .land { fill:var(--land); stroke:var(--landline); stroke-width:.5; vector-effect:non-scaling-stroke; }
  .land.coast { fill:none; stroke:#5b7d99; stroke-width:1.2; }
  .grat { fill:none; stroke:var(--grat); stroke-width:.5; vector-effect:non-scaling-stroke; }
  .ship { stroke:#fff; stroke-width:1.5; cursor:pointer; }
  .ship.sel { stroke:#fff; stroke-width:3; }
  .ais { fill:var(--ais); stroke:#fff; stroke-width:1; cursor:pointer; }
  .lbl { fill:#cfd9e2; font-size:11px; paint-order:stroke; stroke:#0a1520; stroke-width:3px; pointer-events:none; }

  .panel { position:absolute; z-index:5; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px;
           max-width:380px; background:rgba(18,33,47,.95); border:1px solid var(--line); border-radius:12px;
           padding:10px 12px; }
  .panel { padding:8px 10px; }
  .bar { display:flex; align-items:center; gap:6px; }
  .bar h1 { font-size:15px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .barbtn { font-size:13px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:#0e1b27; color:var(--text); cursor:pointer; white-space:nowrap; }
  .panel .body { margin-top:8px; max-height:calc(100vh - 140px); overflow-y:auto; }
  .statline { margin-top:2px; }
  .statline b { color:var(--text); }
  .sect { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 0 4px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .filters select { max-width:none; flex:1; min-width:140px; }
  .sub { color:var(--muted); font-size:12px; }
  a { color:#4fc3f7; }
  .stats { display:flex; gap:8px; margin:8px 0; }
  .stat { flex:1; background:#0e1b27; border:1px solid var(--line); border-radius:8px; padding:5px 6px; text-align:center; }
  .stat b { display:block; font-size:16px; }
  .stat span { font-size:11px; color:var(--muted); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; }
  .legend label, .ais-row label { display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid rgba(255,255,255,.7); }
  .ais-row { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px;
             display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .toggle { background:none; border:none; color:var(--muted); font-size:12px; padding:0; cursor:pointer; float:right; }
  .collapsed .body { display:none; }
  .pns-exit { display:none; position:absolute; z-index:6; right:10px; top:calc(10px + env(safe-area-inset-top)); padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13px; cursor:pointer; }
  body.pns-mode .pns-exit { display:none; }
  @media (max-width:799px){ body.pns-mode .pns-exit { top:calc(64px + env(safe-area-inset-top)); } }
  .legend.ground { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
  .src { font-size:12px; padding:2px 0; }
  select.country { background:#0e1b27; color:var(--text); border:1px solid var(--line); border-radius:6px; font-size:12px; padding:3px 6px; max-width:150px; }
  .chip { font-size:11px; padding:2px 8px; margin:2px 4px 2px 0; border-radius:10px; background:#0e1b27; border:1px solid var(--line); color:var(--text); cursor:pointer; }
  .chip.on { border-color:#38bdf8; background:#0c3047; }
  .src a { color:#4fc3f7; }
  .retry { margin-left:6px; font-size:12px; padding:3px 8px; border-radius:6px; border:1px solid #00e5a0; background:transparent; color:#00e5a0; cursor:pointer; }
  .ais-row { flex-wrap:wrap; }

  .sheet { position:absolute; z-index:6; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
           max-width:380px; background:rgba(18,33,47,.97); border:1px solid var(--line); border-radius:12px;
           padding:10px 12px; display:none; }
  .sheet h3 { margin:0 0 3px; font-size:15px; padding-right:24px; }
  .sheet .close { position:absolute; top:6px; right:8px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#0e1b27; border:1px solid var(--line); margin:2px 4px 2px 0; }
  .sheet { max-height:42vh; overflow-y:auto; }
  @media (min-width:800px){ .sheet { max-height:calc(100vh - 80px); top:10px; bottom:auto; } }
  .tl-head { margin:8px 0 4px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .tl { position:relative; margin-left:4px; }
  .tl-row { display:flex; gap:10px; font-size:13px; padding:3px 0 3px 12px; border-left:2px solid var(--line); position:relative; }
  .tl-row::before { content:""; position:absolute; left:-5px; top:8px; width:8px; height:8px; border-radius:50%; background:var(--line); }
  .tl-row.now::before { background:#4fc3f7; }
  .tl-row.now { font-weight:600; }
  .tl-date { color:var(--muted); min-width:48px; }
  .zoom { position:absolute; z-index:5; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; }
  .zoom button { width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:20px; cursor:pointer; }
  @media (min-width:800px){ .sheet { left:auto; right:60px; } }

  /* ===================== TACTICAL HUD THEME ===================== */
  :root { --bg:#04080b; --land:#0a1a14; --landline:#1d6b4c; --grat:#0b241b; --panel:rgba(3,14,11,.88); --line:#14553e;
          --text:#d8ffe9; --muted:#6fae93; --acc:#39ff9c; --acc2:#3ad7ff; --warn:#ffb000; --ais:#3ad7ff; }
  html,body { font:15px/1.35 "Rajdhani", system-ui, sans-serif; letter-spacing:.02em; background:radial-gradient(ellipse at 50% 40%, #071510 0%, #020405 75%); }
  #map svg { background:transparent; }
  .land { fill:var(--land); stroke:var(--landline); stroke-width:.7; }
  .land.coast { fill:#0c2219; stroke:var(--acc); stroke-opacity:.7; stroke-width:1.1; }
  .grat { stroke:var(--grat); stroke-width:.6; }
  /* scanlines + vignette */
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:20;
    background:repeating-linear-gradient(0deg, rgba(57,255,156,.021) 0 1px, transparent 1px 3px),
               radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%); }
  .sub, .sub a { color:var(--muted); }
  a { color:var(--acc2); }
  b, .stat b, .statline b { font-family:"Share Tech Mono", monospace; color:var(--acc); }

  /* angular glowing panels */
  .panel, .sheet { background:var(--panel); border:1px solid var(--line); border-radius:0;
    box-shadow:0 0 0 1px rgba(57,255,156,.08) inset, 0 0 18px rgba(57,255,156,.12);
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); backdrop-filter:blur(4px); }
  .panel::before, .sheet::before { content:""; position:absolute; left:0; top:0; width:18px; height:18px;
    border-left:2px solid var(--acc); border-top:2px solid var(--acc); pointer-events:none; }
  .panel::after, .sheet::after { content:""; position:absolute; right:0; bottom:0; width:18px; height:18px;
    border-right:2px solid var(--acc); border-bottom:2px solid var(--acc); pointer-events:none; }
  .panel { padding:6px 8px; }
  .bar { gap:5px; }
  .bar h1 { font:700 16px/1 "Rajdhani"; text-transform:uppercase; letter-spacing:.1em; color:var(--acc); text-shadow:0 0 8px rgba(57,255,156,.6); display:flex; align-items:center; gap:8px; }
  .radar { width:18px; height:18px; border-radius:50%; border:1px solid var(--acc); position:relative; flex:none;
    background:conic-gradient(from 0deg, rgba(57,255,156,.75), transparent 28%, transparent); animation:sweep 2.4s linear infinite; box-shadow:0 0 8px rgba(57,255,156,.5); }
  @keyframes sweep { to { transform:rotate(360deg); } }
  .hudstat { font:11px/1 "Share Tech Mono", monospace; color:var(--muted); letter-spacing:.05em; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
  .hudstat span b { font-weight:400; }
  .barbtn, .retry, .chip, select.country, .zoom button, .pns-exit {
    font:600 13px/1 "Rajdhani"; text-transform:uppercase; letter-spacing:.1em; border-radius:0;
    background:rgba(57,255,156,.06); border:1px solid var(--line); color:var(--acc);
    clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px)); }
  .barbtn:hover, .retry:hover, .zoom button:hover, .chip.on { background:rgba(57,255,156,.18); box-shadow:0 0 10px rgba(57,255,156,.4) inset; color:#eafff3; }
  .barbtn { padding:6px 9px; font-size:12px; min-height:32px; }
  select.country { padding:6px 8px; text-transform:none; letter-spacing:.03em; font-family:"Share Tech Mono"; color:var(--text); }
  .zoom { gap:5px; }
  .zoom button { width:36px; height:36px; font-size:18px; }
  .sect { font:700 11px/1 "Rajdhani"; letter-spacing:.22em; color:var(--warn); margin:12px 0 6px; }
  .sect::before { content:"▸ "; }
  .tl-head { font:700 11px/1.2 "Rajdhani"; letter-spacing:.18em; text-transform:uppercase; color:var(--warn); border-top:1px dashed var(--line); }
  .tl-row { border-left:1px solid var(--line); font-family:"Share Tech Mono", monospace; font-size:13px; }
  .tl-row::before { border-radius:0; background:var(--line); transform:rotate(45deg); }
  .tl-row.now::before { background:var(--acc); box-shadow:0 0 8px var(--acc); }
  .tl-date { color:var(--acc2); }
  .tag { border-radius:0; font:600 12px/1.4 "Rajdhani"; text-transform:uppercase; letter-spacing:.08em; background:rgba(57,255,156,.06); border-color:var(--line); }
  .sheet h3 { font:700 19px/1.15 "Rajdhani"; text-transform:uppercase; letter-spacing:.06em; color:#eafff3; }
  .sheet .close { color:var(--acc); font-family:"Share Tech Mono"; }
  .sheet .sheet-kicker { font:12px "Share Tech Mono"; color:var(--warn); letter-spacing:.12em; margin-bottom:4px; }
  .sheet .sheet-kicker::after { content:"_"; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .stat { border-radius:0; background:rgba(57,255,156,.05); border-color:var(--line); }
  .stat span { text-transform:uppercase; letter-spacing:.08em; font-size:10px; }
  input[type=checkbox] { accent-color:var(--acc); }
  .lbl { fill:#bfffe0; font-family:"Share Tech Mono", monospace; text-transform:uppercase; letter-spacing:.04em; stroke:#020405; }
  /* glowing map markers */
  .shipg path, .cluster .cl-ship { filter:drop-shadow(0 0 1.2px currentColor); }
  .cluster .cl-badge { fill:#04080b; stroke:var(--acc); stroke-width:1; }
  .cluster .cl-n { fill:var(--acc); font:11px "Share Tech Mono", monospace; }
  .sel-lbl { fill:#eafff3; }
  .nearc { fill:rgba(57,255,156,.13); stroke:var(--acc); stroke-width:1.4; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 3px rgba(57,255,156,.7)); }
  .near-lbl { fill:var(--acc); font:600 12px "Rajdhani", sans-serif; letter-spacing:.18em; paint-order:stroke; stroke:#020405; stroke-width:3px; pointer-events:none; }
  .near-row { display:flex; flex-wrap:wrap; gap:4px; }
  .water { fill:#3ad7ff; fill-opacity:.55; font:italic 600 11px "Rajdhani", sans-serif; letter-spacing:.22em; pointer-events:none; }
  .site-ico { fill:#04080b; stroke:#eafff3; stroke-width:1.4; }
  .site-ico.port { stroke:#3ad7ff; } .site-ico.school { stroke:#c08bff; }
  .site-lbl { fill:#eafff3; }
  .spec-hero { display:flex; justify-content:center; padding:6px 0 2px; filter:drop-shadow(0 0 4px rgba(57,255,156,.35)); }
  .spec-grid { display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; font-size:13px; }
  .spec-k { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font:600 11px/1.6 "Rajdhani"; }
  .spec-v { font-family:"Share Tech Mono", monospace; color:var(--text); }
  .spec-link { display:inline-block; padding:7px 10px; text-decoration:none; }
  .contact { display:flex; align-items:center; gap:10px; width:100%; margin:4px 0; padding:8px 10px; text-align:left;
    background:rgba(57,255,156,.05); border:1px solid var(--line); color:var(--text); font:600 14px "Rajdhani"; letter-spacing:.04em; cursor:pointer; }
  .contact:hover { background:rgba(57,255,156,.15); }
  .dep .halo { animation:pulse 2.6s ease-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes pulse { 0% { transform:scale(.6); opacity:1; } 100% { transform:scale(1.6); opacity:0; } }
  .reticle { fill:none; stroke:var(--acc); stroke-width:1.6; filter:drop-shadow(0 0 4px var(--acc)); }
  .reticle-spin { animation:sweep 6s linear infinite; transform-box:fill-box; transform-origin:center; }
  .ais { filter:drop-shadow(0 0 4px var(--acc2)); }
  .ally .glow { animation:pulse 1.8s ease-out infinite; transform-box:fill-box; transform-origin:center; }
  .ally.on { filter:drop-shadow(0 0 6px var(--gc)) drop-shadow(0 0 2px #fff); }
  .usflag { pointer-events:none; }
  .basemap path { vector-effect:non-scaling-stroke; }
  .bm-base { fill:rgba(57,255,156,.06); stroke:rgba(57,255,156,.55); stroke-width:1.2; stroke-dasharray:5 3; }
  .bm-beach { fill:rgba(255,214,130,.10); stroke:none; }
  .bm-golf { fill:rgba(120,200,90,.13); stroke:none; }
  .bm-water { fill:rgba(20,60,90,.55); stroke:rgba(58,215,255,.25); stroke-width:.6; }
  .bm-apron { fill:rgba(160,180,190,.16); stroke:rgba(160,180,190,.35); stroke-width:.6; }
  .bm-taxi { fill:none; stroke:rgba(200,215,220,.35); }
  .bm-rwy { fill:none; stroke:#b9c6cc; stroke-opacity:.55; }
  .bm-rwyc { fill:none; stroke:#fff; stroke-opacity:.7; stroke-dasharray:8 6; stroke-width:.8; }
  .bm-major { fill:none; stroke:#ffb000; stroke-opacity:.7; stroke-width:2; }
  .bm-minor { fill:none; stroke:#cfe8dc; stroke-opacity:.28; stroke-width:1; }
  .bm-bld { fill:rgba(58,215,255,.22); stroke:rgba(58,215,255,.55); stroke-width:.5; }
  .bm-coast { fill:none; stroke:var(--acc); stroke-opacity:.8; stroke-width:1.2; }
  .bm-lbl { font:600 10px "Share Tech Mono", monospace; fill:#d8fbe9; paint-order:stroke; stroke:#04080b; stroke-width:3; letter-spacing:.06em; pointer-events:none; }
  .bm-rwylbl { font:700 10px "Share Tech Mono", monospace; fill:#fff; paint-order:stroke; stroke:#04080b; stroke-width:3; pointer-events:none; }
  .poi circle { stroke:#04080b; stroke-width:1.2; }
  .poi.on circle.ring { animation:pulse 1.8s ease-out infinite; transform-box:fill-box; transform-origin:center; }
  .aship { filter:drop-shadow(0 0 2px rgba(255,255,255,.35)); }
  .aship.rival { filter:drop-shadow(0 0 3px rgba(255,59,59,.9)); }
  .aship.on { filter:drop-shadow(0 0 7px var(--gc)) drop-shadow(0 0 2px #fff); }
  .aship .glow { animation:pulse 1.8s ease-out infinite; transform-box:fill-box; transform-origin:center; }
  .src a { color:var(--acc2); }

  /* ===================== MILITARY-SHOOTER MENU THEME (olive / sand / white) ===================== */
  :root { --bg:#0e100b; --land:#2b2f20; --landline:#5d6244; --grat:rgba(216,201,163,.07); --panel:rgba(18,20,13,.93); --line:#47492f;
          --text:#f3efe2; --muted:#a9a588; --acc:#d6c592; --acc2:#bcc85c; --warn:#e9c84a; --ais:#9fd3e3;
          --cond:"Barlow Condensed", "Rajdhani", system-ui, sans-serif; }
  html,body { font:500 15px/1.35 "Barlow", system-ui, sans-serif; letter-spacing:.01em;
    background:radial-gradient(ellipse at 50% 35%, #1b1e14 0%, #0b0c08 80%); }
  body::after { background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(90deg, rgba(214,197,146,.025) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg, rgba(214,197,146,.025) 0 1px, transparent 1px 64px); }
  .land { fill:var(--land); stroke:var(--landline); stroke-width:.8; }
  .land.coast { fill:#262a1c; stroke:var(--acc); stroke-opacity:.55; stroke-width:1.1; }
  .grat { stroke:var(--grat); }
  b, .stat b, .statline b { font-family:var(--cond); font-weight:700; color:#fff; }
  a { color:var(--acc); }
  /* flat dark panels with a sand accent bar, like a loadout menu */
  .panel, .sheet { clip-path:none; border:1px solid rgba(214,197,146,.22); border-left:3px solid var(--acc);
    background:linear-gradient(180deg, rgba(30,33,22,.95), rgba(14,15,10,.95)); box-shadow:0 8px 28px rgba(0,0,0,.55); backdrop-filter:blur(6px); }
  .panel::before, .sheet::before, .panel::after, .sheet::after { display:none; }
  .bar h1 { font:800 18px/1 var(--cond); letter-spacing:.07em; color:#fff; text-shadow:none; }
  .bar h1::before { content:""; width:10px; height:18px; background:repeating-linear-gradient(90deg, var(--acc) 0 3px, transparent 3px 5px); display:inline-block; }
  .radar { display:none; }
  .hudstat { font:600 12px/1 var(--cond); letter-spacing:.12em; color:var(--muted); }
  .hudstat b { color:var(--acc2); }
  .barbtn, .retry, .chip, select.country, .zoom button, .pns-exit {
    clip-path:none; border-radius:0; font:700 13px/1 var(--cond); letter-spacing:.14em; text-transform:uppercase;
    background:rgba(214,197,146,.07); border:1px solid rgba(214,197,146,.3); color:#f3efe2; }
  .barbtn:hover, .retry:hover, .zoom button:hover, .chip.on, .contact:hover { background:var(--acc); color:#15160f; box-shadow:none; border-color:var(--acc); }
  select.country { font:600 13px var(--cond); letter-spacing:.06em; text-transform:none; }
  .sect { font:800 12px/1 var(--cond); letter-spacing:.24em; color:var(--acc); }
  .sect::before { content:"▍"; color:var(--acc2); }
  .tl-head { font:800 12px/1.2 var(--cond); letter-spacing:.22em; color:var(--acc); border-top:1px solid rgba(214,197,146,.18); }
  .tl-row { font:600 14px var(--cond); letter-spacing:.04em; border-left:1px solid rgba(214,197,146,.25); }
  .tl-row.now::before { background:var(--acc2); box-shadow:none; }
  .tl-date { color:var(--acc); }
  .tag { font:700 12px/1.5 var(--cond); letter-spacing:.12em; background:rgba(188,200,92,.12); border-color:rgba(188,200,92,.45); color:#eef2c8; }
  .sheet h3 { font:800 24px/1.05 var(--cond); letter-spacing:.04em; color:#fff; }
  .sheet .close { color:var(--acc); }
  .sheet .sheet-kicker { display:inline-block; font:800 12px/1 var(--cond); letter-spacing:.22em; color:#15160f; background:var(--acc);
    padding:4px 10px 4px 8px; margin:-2px 0 8px -12px; }
  .sheet .sheet-kicker::before { content:"▓▓ "; letter-spacing:0; opacity:.7; }
  .sheet .sheet-kicker::after { content:""; animation:none; }
  .stat { background:rgba(214,197,146,.06); border-color:rgba(214,197,146,.22); }
  .stat span { font:600 11px var(--cond); letter-spacing:.14em; color:var(--muted); }
  .lbl { fill:#f3efe2; font-family:var(--cond); font-weight:700; letter-spacing:.08em; stroke:#0b0c08; }
  .sel-lbl { fill:#fff; }
  .cluster .cl-badge { fill:var(--acc); stroke:none; }
  .cluster .cl-n { fill:#15160f; font:800 11px var(--cond); }
  .reticle { stroke:var(--acc2); filter:none; }
  .nearc { fill:rgba(188,200,92,.14); stroke:var(--acc2); filter:none; }
  .near-lbl { fill:#eef2c8; font:800 12px var(--cond); }
  .water { fill:#9fb6b8; fill-opacity:.5; font:italic 600 12px var(--cond); }
  .spec-hero { filter:none; }
  .spec-k { font:700 12px/1.6 var(--cond); letter-spacing:.14em; color:var(--muted); }
  .spec-v { font:600 14px var(--cond); letter-spacing:.03em; color:#f3efe2; }
  .contact { font:700 15px var(--cond); letter-spacing:.06em; background:rgba(214,197,146,.06); border-color:rgba(214,197,146,.22); border-left:3px solid transparent; }
  .contact:hover { border-left-color:#15160f; }
  input[type=checkbox] { accent-color:var(--acc2); }

    ["CREW", crew(c.crew), 6000, crew(c.crew) && crew(c.crew).toLocaleString()]].filter(r => r[1]);

let countriesGeo = null, near = null;   // near: {ship, list:[{f, name, km, lbl:[lon,lat]}]}
async function loadCountries() {
  if (countriesGeo) return countriesGeo;
  const m = await import("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json/+esm");
  const t = m.default || m;
  countriesGeo = topojson.feature(t, t.objects.countries).features
    .filter(f => d3.geoArea(f) < 2 * Math.PI)
    .map(f => ({ f, name: f.properties.name, verts: f.geometry.type === "Polygon" ? f.geometry.coordinates.flat() : f.geometry.coordinates.flat(2) }));
  return countriesGeo;
}
async function findNear(s) {
  const P = [s.lon, s.lat];
  try { await loadCountries(); } catch { return null; }
  const scored = countriesGeo.map(c => {
    let best = Infinity, bv = null;
    for (const v of c.verts) { const d = d3.geoDistance(P, v); if (d < best) { best = d; bv = v; } }
    return { ...c, km: best * 6371, nearest: bv };
  }).sort((a, b) => a.km - b.km);
  if (!scored.length) return null;
  const lim = Math.min(600, Math.max(250, scored[0].km * 2.2));
  let list = scored.filter(c => c.km < lim).slice(0, 4);
  if (!list.length) list = scored.slice(0, 2);          // open ocean: show the nearest coasts
  for (const c of list) {                               // label a little inland from the closest coast point
    const cen = d3.geoCentroid(c.f);
    c.lbl = d3.geoInterpolate(c.nearest, cen)(c.km > 900 ? 0.15 : 0.3);
  }
  return { ship: s, list };
}

// ---------- NAS Pensacola base map (OpenStreetMap, built by Supabase pns-basemap) ----------
const BM = { feats: null, loading: false, err: null, sel: null, src: "" };
const POI_CAT = { gate: ["Entry gate", "#ffb000", "⛩"], air: ["Airfield", "#cfd8dc", "✈"], food: ["Food / galley", "#ff7a59", "🍽"],
  barracks: ["Barracks", "#c08bff", "🛏"], shop: ["Shopping (NEX / commissary)", "#39ff9c", "🛒"], svc: ["Services", "#3ad7ff", "ⓘ"],
  medical: ["Medical", "#ff5a7a", "✚"], history: ["Museum / historic", "#e9c46a", "🏛"] };
async function loadBasemap() {
  if (BM.feats || BM.loading) return;
  BM.loading = true;
  try {
    if (mcp === undefined) mcp = await claude.use("mcp");
    if (!mcp) throw Object.assign(new Error("needs Supabase"), { code: "no_mcp" });
    const d = await runSql(`select data from pns_basemap where id = 1`);
    if (!d || !d.origin) throw new Error("base map not built yet");
    const [ox, oy] = d.origin;
    const dec = str => str.split(" ").map(q => { const [x, y] = q.split(","); return [ox + x / 1e5, oy + y / 1e5]; });
    const F = {};
    for (const k of ["taxiway", "apron", "bld", "coast", "water", "golf", "beach", "base"]) F[k] = (d[k] || []).map(dec);
    F.runway = (d.runway || []).map(([str, ref]) => ({ pts: dec(str), ref }));
    F.major = (d.major || []).map(([str, name]) => ({ pts: dec(str), name }));
    F.minor = (d.minor || []).map(([str, name]) => ({ pts: dec(str), name }));
    BM.feats = F; BM.src = d.source || "© OpenStreetMap contributors"; BM.err = null;
  } catch (e) { BM.err = e.code === "no_mcp" ? "The base map needs your Supabase connection." : "Couldn't load the base map (" + (e.code || e.message) + ")."; }
  BM.loading = false;
  draw();
}
function drawBasemap() {
  const on = pns.on && BM.feats && T.k >= 3;
  if (!on) { gBase.selectAll("*").remove(); if (!pns.on) gPns.selectAll("g.poi").remove(); return; }
  const W = el.clientWidth, H = el.clientHeight, F = BM.feats;
  // planar path string from projected points; skips shapes entirely off screen
  const d = (rings, closed) => { let out = "";
    for (const r of rings) { const pp = r.map(SPJ); let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
      for (const [x, y] of pp) { if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
      if (maxx < -50 || minx > W + 50 || maxy < -50 || miny > H + 50) continue;
      out += "M" + pp.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + (closed ? "Z" : ""); }
    return out; };
  // pixels per metre at the base, for true-width runways and taxiways
  const a = SPJ([-87.30, 30.35]), b = SPJ([-87.29, 30.35]), ppm = Math.hypot(b[0] - a[0], b[1] - a[1]) / 961;
  const layers = [
    ["bm-base", d(F.base, true)], ["bm-beach", d(F.beach, true)], ["bm-golf", d(F.golf, true)], ["bm-water", d(F.water, true)],
    ["bm-apron", d(F.apron, true)], ["bm-taxi", d(F.taxiway, false)], ["bm-rwy", d(F.runway.map(r => r.pts), false)],
    ["bm-rwyc", T.k >= 8 ? d(F.runway.map(r => r.pts), false) : ""],
    ["bm-minor", T.k >= 6 ? d(F.minor.map(r => r.pts), false) : ""], ["bm-major", d(F.major.map(r => r.pts), false)],
    ["bm-bld", T.k >= 9 ? d(F.bld, true) : ""], ["bm-coast", d(F.coast, false)]];
  gBase.selectAll("path").data(layers, l => l[0]).join("path").attr("class", l => l[0]).attr("d", l => l[1])
    .style("stroke-width", l => l[0] === "bm-rwy" ? Math.max(3, 45 * ppm) + "px" : l[0] === "bm-taxi" ? Math.max(1, 20 * ppm) + "px" : null);
  // runway designators at the runway ends
  const rl = T.k >= 6 ? F.runway.filter(r => r.ref).flatMap(r => { const [e1, e2] = r.ref.split("/"), p0 = r.pts[0], p1 = r.pts[r.pts.length - 1];
    return [{ t: e1, p: p0, id: r.ref + "a" }, { t: e2, p: p1, id: r.ref + "b" }]; }) : [];
  gBase.selectAll("text.bm-rwylbl").data(rl, x => x.id).join("text").attr("class", "bm-rwylbl")
    .attr("x", x => SPJ(x.p)[0]).attr("y", x => SPJ(x.p)[1] + 4).attr("text-anchor", "middle").text(x => x.t);
  // street names for major roads when zoomed in
  const seen = new Set(), sl = T.k >= 14 ? F.major.concat(T.k >= 22 ? F.minor : []).filter(r => r.name && !seen.has(r.name) && seen.add(r.name)).map(r => ({ id: r.name, p: r.pts[Math.floor(r.pts.length / 2)] }))
    .filter(x => { const [px, py] = SPJ(x.p); return px > 10 && px < W - 60 && py > 10 && py < H - 10; }) : [];
  gBase.selectAll("text.bm-lbl").data(sl, x => x.id).join("text").attr("class", "bm-lbl").attr("font-size", 9)
    .attr("x", x => SPJ(x.p)[0]).attr("y", x => SPJ(x.p)[1]).text(x => trunc(x.id.toUpperCase(), 22)).style("opacity", .7);
}
function drawPois() {
  const show = pns.on && T.k >= 3 && pns.meta && pns.meta.base;
  const list = show ? pns.meta.base.poi : [];
  const W = el.clientWidth, labelAll = T.k >= 60;
  const gp = gPns.selectAll("g.poi").data(list, x => x.name).join(en => { const x = en.append("g").attr("class", "poi").style("cursor", "pointer");
    x.append("circle").attr("class", "ring"); x.append("circle").attr("class", "dot"); x.append("text").attr("class", "ico"); x.append("text").attr("class", "lbl"); return x; });
  gp.attr("transform", x => `translate(${SPJ([x.lon, x.lat])})`).classed("on", x => x === BM.sel)
    .on("click", (e, x) => { e.stopPropagation(); showPoi(x); });
  gp.select(".ring").attr("r", x => x === BM.sel ? 16 : 0).attr("fill", "none").attr("stroke", x => POI_CAT[x.cat][1]).attr("stroke-width", 2);
  gp.select(".dot").attr("r", x => x === BM.sel ? 11 : 9).attr("fill", "rgba(6,14,18,.9)").attr("stroke", x => POI_CAT[x.cat][1]).attr("stroke-width", 1.6);
  gp.select(".ico").attr("text-anchor", "middle").attr("dominant-baseline", "central").attr("font-size", 10).attr("fill", x => POI_CAT[x.cat][1]).text(x => POI_CAT[x.cat][2]);
  // Greedy label placement: selected first, then gates, airfield, galley/barracks, shops, the rest; skip overlaps
  const PR = { gate: 1, air: 2, food: 3, barracks: 3, shop: 4, medical: 5, history: 6, svc: 7 }, boxes = [], shown = new Set();
  for (const x of [...list].sort((p, q) => (p === BM.sel ? -1 : q === BM.sel ? 1 : PR[p.cat] - PR[q.cat]))) {
    const [px, py] = SPJ([x.lon, x.lat]), w = x.short.length * 7.6 + 4, flip = px > W - 110;
    const bx = [flip ? px - 13 - w : px + 13, py - 7, w, 13];
    const dotHit = list.some(o => o !== x && (([ox, oy]) => ox > bx[0] - 8 && ox < bx[0] + bx[2] + 8 && oy > bx[1] - 6 && oy < bx[1] + bx[3] + 6)(SPJ([o.lon, o.lat])));
    if (x !== BM.sel && (boxes.some(b => bx[0] < b[0] + b[2] && b[0] < bx[0] + bx[2] && bx[1] < b[1] + b[3] && b[1] < bx[1] + bx[3]) || (dotHit && !labelAll))) continue;
    boxes.push(bx); shown.add(x);
  }
  gp.select(".lbl").each(function (x) { const px = SPJ([x.lon, x.lat])[0], flip = px > W - 110; d3.select(this).attr("x", flip ? -13 : 13).attr("text-anchor", flip ? "end" : "start"); })
    .attr("y", 4).attr("font-size", 12).attr("stroke-width", 3)
    .text(x => shown.has(x) ? x.short : "");
  gp.filter(x => x === BM.sel).raise();
}
function showPoi(x) {
  const c = POI_CAT[x.cat];
  openSheet(`<div class="sheet-kicker">NAS PENSACOLA // ${esc(c[0].toUpperCase())}</div><h3><span style="color:${c[1]}">${c[2]}</span> ${esc(x.name)}</h3>

async function pnsLoad() {
  try {
    if (mcp === undefined) mcp = await claude.use("mcp");
  } catch { mcp = null; }
  if (!mcp) { pns.err = "Live Pensacola data needs your Supabase connection"; return; }
  try {
    pns.data = await runSql(`select json_build_object(
      'vessels', coalesce((select json_agg(json_build_object('mmsi',mmsi,'name',name,'type',ship_type,'lat',lat,'lon',lon,'sog',sog,'cog',cog,'zone',zone,'t',seen_at) order by seen_at desc) from pns_vessels where seen_at > now() - interval '24 hours'), '[]'::json),
      'aircraft', coalesce((select json_agg(json_build_object('hex',hex,'flight',flight,'reg',reg,'type',type,'lat',lat,'lon',lon,'alt',alt,'gs',gs,'track',track,'t',seen_at,'route_from',route_from,'route_to',route_to) order by flight) from pns_aircraft where seen_at > now() - interval '30 minutes'), '[]'::json),
      'events', coalesce((select json_agg(json_build_object('name',name,'mmsi',mmsi,'event',event,'t',seen_at) order by seen_at desc) from (select * from pns_port_events where seen_at > now() - interval '7 days' order by seen_at desc limit 30) e), '[]'::json),
      'stats', json_build_object('vessels45', (select count(distinct mmsi) from pns_vessel_tracks), 'aircraft24', (select count(distinct hex) from pns_aircraft_tracks where seen_at > now() - interval '24 hours'),
                                 'lastRun', (select ran_at from pns_runs order by id desc limit 1)))`);
    if (!pns.data || !Array.isArray(pns.data.vessels) || !Array.isArray(pns.data.aircraft)) {
      pns.data = { vessels: [], aircraft: [], events: [], stats: {} }; throw Object.assign(new Error("bad reply"), { code: "parse_error" });
    }
    pns.err = null;
  } catch (e) { pns.err = `Couldn't load live Pensacola data (${(e && (e.code || e.name)) || "error"}${e && e.message ? ": " + String(e.message).slice(0, 80) : ""})`; }
}

const ago = t => { const m = Math.round((Date.now() - new Date(t).getTime()) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };

// Airfields used to work out where an aircraft took off from / is heading (ICAO, name, lat, lon)
const AIRFIELDS = [["KNPA", "NAS Pensacola (Forrest Sherman Field)", 30.3527, -87.3186], ["KNSE", "NAS Whiting Field North", 30.7244, -87.0219],
  ["KNDZ", "NAS Whiting Field South", 30.6977, -87.0230], ["KNUN", "Saufley Field", 30.4694, -87.3381], ["KNBJ", "NOLF Barin", 30.3896, -87.6355],
  ["KNFJ", "NOLF Choctaw", 30.5069, -86.9597], ["KPNS", "Pensacola International", 30.4734, -87.1866], ["KVPS", "Eglin AFB", 30.4832, -86.5254],
  ["KHRT", "Hurlburt Field", 30.4278, -86.6893], ["KEGI", "Duke Field", 30.6519, -86.5226], ["KDTS", "Destin Executive", 30.4001, -86.4715],
  ["KMOB", "Mobile Regional", 30.6912, -88.2428], ["KBFM", "Mobile Downtown", 30.6268, -88.0681], ["KBIX", "Keesler AFB", 30.4104, -88.9244],
  ["KCEW", "Bob Sikes (Crestview)", 30.7788, -86.5221], ["KECP", "Northwest Florida Beaches Intl", 30.3571, -85.7956], ["KPAM", "Tyndall AFB", 30.0696, -85.5754],
  ["KJKA", "Jack Edwards (Gulf Shores)", 30.2896, -87.6718], ["KNMM", "NAS Meridian", 32.5521, -88.5556], ["KOZR", "Cairns AAF (Fort Novosel)", 31.2757, -85.7135]];
// Common military callsign prefixes → operator
const CALLSIGNS = [[/^RCH/, "U.S. Air Force Air Mobility Command (\"Reach\")"], [/^(CNV|VV)/, "U.S. Navy"], [/^PAT/, "U.S. Army priority air transport"],
  [/^SPAR/, "U.S. Air Force VIP transport"], [/^SAM/, "Special Air Mission (VIP)"], [/^(CGNR|COAST)/, "U.S. Coast Guard"], [/^BLUE ?ANGEL|^BLUE/, "Blue Angels"],
  [/^(SHARK|PCOLA|NAVY)/, "Naval air training"], [/^TOPCAT|^KATANA/, "Naval air training squadron"], [/^(TALON|ROCKY|ROBIN)/, "Training squadron"]];
const kmBetween = (a, b) => d3.geoDistance(a, b) * 6371;
const compass = deg => ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const bearing = (a, b) => { const r = Math.PI / 180, y = Math.sin((b[0] - a[0]) * r) * Math.cos(b[1] * r),
  x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos((b[0] - a[0]) * r); return (Math.atan2(y, x) / r + 360) % 360; };
const nearestField = (p, maxKm) => { let best = null; for (const f of AIRFIELDS) { const d = kmBetween(p, [f[3], f[2]]); if (d <= maxKm && (!best || d < best.d)) best = { f, d }; } return best; };
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const agoMin = t => { const m = Math.round((Date.now() - new Date(t).getTime()) / 60000); return m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };

// Where it came from / where it's going: published route if known, otherwise worked out from the flight path
function routeGuess(a, pts) {
  // the current flight = the latest run of fixes with no gap over 40 minutes
  let seg = pts.slice(); for (let i = pts.length - 1; i > 0; i--) if (new Date(pts[i].t) - new Date(pts[i - 1].t) > 40 * 60000) { seg = pts.slice(i); break; }
  const now = [a.lon, a.lat], first = seg[0];
  let from, to;
  if (a.route_from) from = { text: a.route_from, how: "published route" };
  else if (first && seg.length > 1) {
    const fp = [first.lon, first.lat], f = nearestField(fp, 15);
    if (f && first.alt < 3000) from = { text: `${f.f[1]} (${f.f[0]})`, how: `took off around ${fmtTime(first.t)} — first seen ${f.d < 2 ? "over" : Math.round(f.d) + " km from"} the field at ${Math.max(0, first.alt).toLocaleString()} ft` };
    else from = { text: `from the ${compass(bearing(now, fp))}`, how: `first picked up ${agoMin(first.t)} at ${Math.max(0, first.alt).toLocaleString()} ft, ${Math.round(kmBetween(now, fp))} km from here` };
  } else from = { text: "Not known yet", how: "only one sighting so far — check back after the next 10-minute update" };
  if (a.route_to) to = { text: a.route_to, how: "published route" };
  else if (a.alt <= 200 && (a.gs ?? 0) < 60) { const f = nearestField(now, 5); to = { text: f ? `On the ground at ${f.f[1]}` : "On the ground", how: "not moving fast enough to be flying" }; }
  else if (a.track != null) {
    const prev = seg.length > 1 ? seg[seg.length - 2] : null, descending = prev && a.alt < prev.alt - 300;
    let best = null;
    for (const f of AIRFIELDS) { const fp = [f[3], f[2]], d = kmBetween(now, fp), off = Math.abs(((bearing(now, fp) - a.track + 540) % 360) - 180);
      if (d > 2 && d < 150 && off < 30) { const sc = d * (1 + off / 15); if (!best || sc < best.sc) best = { f, d, sc }; } }
    if (best && (descending || a.alt < 6000)) to = { text: `${best.f[1]} (${best.f[0]})`, how: `${Math.round(best.d)} km ahead on its current heading${descending ? ", descending" : ""}${a.gs ? ` — about ${Math.max(1, Math.round(best.d / (a.gs * 1.852) * 60))} min away` : ""}` };
    else to = { text: `Heading ${compass(a.track)}`, how: best ? `${best.f[1]} is ${Math.round(best.d)} km ahead on this heading, but it isn't descending yet` : "no airfield directly ahead within 150 km" };
  } else to = { text: "Not known", how: "no heading broadcast" };
  return { from, to, seg };
}

    const r = routeGuess(a, pts);

}

async function enterPensacola() {
  pns.on = true; document.body.classList.add("pns-mode"); $("pnsBtn").textContent = "🌐 WORLD";
  zoom.scaleExtent([1, 120]);
  if (!pns.meta) { try { pns.meta = await (await fetch("data/pensacola.json", { cache: "no-store" })).json(); } catch { pns.meta = { sites: [], news: [] }; } }
  if (!pns.landHi) {
    import("https://cdn.jsdelivr.net/npm/world-atlas@2/land-10m.json/+esm")
      .then(m => { const t = m.default || m; const L = topojson.feature(t, t.objects.land);
        const polys = L.features.flatMap(f => f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates)
          .filter(p => d3.geoArea({ type: "Polygon", coordinates: p }) < 2 * Math.PI);   // drop inverted "whole globe" artefacts
        pns.landHi = { type: "MultiPolygon", coordinates: polys }; if (pns.on) size(); })
      .catch(() => {});
  }
  collapsePanel();
  await pnsLoad(); draw(); showPnsSummary(); loadBasemap();
  // Core training area (NAS Pensacola, Whiting Field, Pensacola Pass, near Gulf) in a local projection
  svg.call(zoom.transform, d3.zoomIdentity); size();
  clearInterval(pns.timer); pns.timer = setInterval(async () => { if (pns.on) { await pnsLoad(); draw(); } }, 5 * 60 * 1000);
}
function exitPensacola() {

const photoCache = new Map();
const photoSlot = () => `<div id="photoSlot" class="photo"><div class="photo-ph">Loading photo…</div></div>`;
async function loadPhoto(key) {

// ---------- Order of battle: fleet → group → ship ----------
const FLEETS = [
  ["5th Fleet", "Middle East · Bahrain", s => /Arabian|Red Sea|Middle East|Gulf|Oman|Aden/i.test(s.area) || (s.lon > 32 && s.lon <= 68 && s.lat < 32 && s.lat > -10)],

  ["7th Fleet", "Western Pacific & Indian Ocean · Yokosuka", s => /Philippine|Japan|South China|Korea|Guam|Indian Ocean|Sasebo|Yokosuka/i.test(s.area) || s.lon > 68 || s.lon < -160],
  ["4th Fleet", "Caribbean & Latin America · Mayport", s => /Caribbean|Latin|Panama/i.test(s.area) || (s.lat < 30 && s.lon > -100 && s.lon < -50)],
  ["3rd Fleet", "Eastern Pacific · San Diego", s => /San Diego|Eastern Pacific|Hawaii|Pearl/i.test(s.area) || (s.lon <= -100 && s.lon >= -160)],
  ["2nd Fleet / Home", "Atlantic · Norfolk", s => true]];
const TYPE_ORDER = { carrier: 0, amphib: 1, cruiser: 2, destroyer: 3, other: 4 };
let oobTab = "us", usniMeta = {};
// Firepower score used to rank fleets, groups and navies (most important at the top / left)
const WEIGHT = { carrier: 10, amphib: 6, cruiser: 3, destroyer: 2, other: 1 };
const score = list => list.reduce((a, x) => a + (WEIGHT[x.type] || 1), 0);
const FLEET_PARENT = { "5th Fleet": "U.S. Naval Forces Central Command", "6th Fleet": "U.S. Naval Forces Europe-Africa", "7th Fleet": "U.S. Pacific Fleet",
  "3rd Fleet": "U.S. Pacific Fleet", "4th Fleet": "U.S. Naval Forces Southern Command", "2nd Fleet / Home": "U.S. Fleet Forces Command" };
const shortName = n => n.replace(/^(USS|USNS|HMS|HMAS|HMCS|HNoMS|ITS|JS|TCG|FS|CNS|RFS) /, "").replace(/ \(.*\)$/, "");
function leafHtml(x, kind, icon) {

}
function oobHtml() {
  const tabs = [["us", "U.S. Navy"], ["ally", "Allies"], ["rival", "Rivals"]];
  let root, tiers, sum, note;
  if (oobTab === "us") {
    const byFleet = FLEETS.map(([n, a]) => ({ n, a, ships: [] }));
    for (const x of ships) byFleet[FLEETS.findIndex(f => f[2](x))].ships.push(x);
    const fleets = byFleet.filter(f => f.ships.length).sort((a, b) => score(b.ships) - score(a.ships));
    root = `<div class="ot-node ot-root"><span class="ot-k">Chief of Naval Operations</span><b>${brandImg("navy", "hero")} 🇺🇸 U.S. Navy</b><span class="ot-c">${ships.length} ships tracked · ${ships.filter(x => x.type === "carrier").length} carriers</span></div>`;
    tiers = fleets.map((f, i) => {
      const groups = d3.groups(f.ships, x => x.group || "Independent").map(([g, l]) => ({ g, l: l.sort((a, b) => WEIGHT[b.type] - WEIGHT[a.type] || a.name.localeCompare(b.name)) }))
        .sort((a, b) => score(b.l) - score(a.l));
      return `<div class="ot-tier"><div class="ot-rank">#${i + 1}</div><ul class="ot-tree"><li>
        <div class="ot-node ot-fleet"><span class="ot-k">${esc(FLEET_PARENT[f.n] || "")}</span><b>${esc(f.n)}</b><span class="ot-c">${esc(f.a)} · ${f.ships.length} ship${f.ships.length > 1 ? "s" : ""}</span></div>
        <ul>${groups.map(({ g, l }) => { const lead = l[0];
          const label = /^CSG/.test(g) && lead.type === "carrier" ? `${g} · ${shortName(lead.name)}` : g;
          return `<li><div class="ot-node ot-grp"><b>${esc(label)}</b><span class="ot-c">${l.length} ship${l.length > 1 ? "s" : ""}</span></div>
            <ul class="ot-col">${l.map(x => leafHtml(x, "us", shipIcon(x.type, 22))).join("")}</ul></li>`; }).join("")}</ul></li></ul></div>`;
    }).join("");
    note = `Ranked by firepower (carriers count most). Fleets are assigned from each ship's reported sea area (USNI News, ${esc(snapshotDate || usniMeta.asOf || "")}); positions and groupings are approximate.`;
  } else {
    const rival = oobTab === "rival";
    const list = [...(rival ? rivalShips : allyShips), ...allyAis.map(v => ({ ...v, live: true, id: "ais" + v.mmsi, type: "destroyer" }))].filter(d => RIVAL.has(d.country) === rival);
    const byC = d3.groups(list, d => d.country).map(([c, l]) => ({ c, l: l.sort((a, b) => (a.live ? 1 : 0) - (b.live ? 1 : 0) || WEIGHT[b.type] - WEIGHT[a.type]) }))
      .sort((a, b) => score(b.l) - score(a.l));
    root = `<div class="ot-node ot-root"><span class="ot-k">${rival ? "🇷🇺 🇨🇳 🇮🇷 🇰🇵" : "🇬🇧 🇫🇷 🇯🇵 🇦🇺 🇮🇳 …"}</span><b>${rival ? "Rival navies" : "Allies & partners"}</b><span class="ot-c">${list.length} ships · ${byC.length} navies</span></div>`;
    tiers = byC.map(({ c, l }, i) => `<div class="ot-tier"><div class="ot-rank">#${i + 1}</div><ul class="ot-tree"><li>

  }
  return `<div class="oob-in"><div class="oob-top"><div class="oob-title">${brandImg("hierarchy")}<small>▓▓ FLEET COMMAND</small>Order of battle</div><button class="barbtn" id="oobClose">✕ Close</button></div>

    <div class="ot-wrap">${root}<div class="ot-spine">${tiers}</div></div><div class="oob-note">${note}</div></div>`;
}

        name, type: current?.type || "other", area: report.area,
        lat: report.lat, lon: report.lon

  for (const slot of ["A", "B"]) {

  if (!m) {

    err.code = "parse_error"; throw err;
  }
  const b64 = m[1].replace(/\\n|\s/g, "");
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function runSql(inner) {
  const res = await mcp.callTool("Supabase", "execute_sql", { project_id: SUPA_PROJECT, query: wrapSql(inner) });
  return decodeSqlReply(res);
}

// (legacy) Supabase's execute_sql reply can arrive in several wrappings: an object
// {result: "...<untrusted-data-…>[rows]</untrusted-data-…>..."}, that same
// object as raw JSON text, a {content:[{text}]} envelope, or escaped text.
// Unwrap layer by layer until we reach the rows array.
function parseSqlResult(payload) {
  const tryJSON = s => { try { return JSON.parse(s); } catch { return undefined; } };
  const TAG = /<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data/;
  let x = payload;
  for (let i = 0; i < 8; i++) {
    if (Array.isArray(x)) {
      if (x.length && x[0] && typeof x[0] === "object" && "type" in x[0] && "text" in x[0]) { x = x.map(c => c.text || "").join(""); continue; }
      return x;
    }
    if (x && typeof x === "object") {
      if ("result" in x) { x = x.result; continue; }
      if (x.structuredContent) { x = x.structuredContent; continue; }
      if (Array.isArray(x.content)) { x = x.content.map(c => c.text || "").join(""); continue; }
      if ("d" in x) return [x];
      break;
    }
    if (typeof x === "string") {
      const s = x.trim();
      const j = tryJSON(s);
      if (j !== undefined && j !== s) { x = j; continue; }
      const m = s.match(TAG);
      let body = m ? m[1] : (s.includes("[") ? s.slice(s.indexOf("["), s.lastIndexOf("]") + 1) : "");
      let parsed = tryJSON(body);
      if (parsed === undefined) {                    // still escaped (\" inside)
        const unesc = tryJSON('"' + body.replace(/"/g, '\\"').replace(/\\\\"/g, '\\"') + '"');
        parsed = typeof unesc === "string" ? tryJSON(unesc) : undefined;
        if (parsed === undefined) parsed = tryJSON(body.replace(/\\"/g, '"').replace(/\\\\/g, "\\"));
      }
      if (parsed !== undefined) { x = parsed; continue; }
      break;
    }
    break;
  }
  const peek = (() => { try { return JSON.stringify(payload).slice(0, 160); } catch { return String(payload).slice(0, 160); } })();
  const err = new SyntaxError("Unrecognized Supabase reply: " + peek);
  err.code = "parse_error"; throw err;
}

let mcp;
async function loadAis() {
  if (!showAis) return;
  $("aisStatus").textContent = "loading live feed…";
  try {
    if (mcp === undefined) mcp = await claude.use("mcp");
  } catch { mcp = null; }
  if (!mcp) { $("aisStatus").textContent = "live feed needs your Supabase connection"; return; }
  try {
    const d = await runSql(AIS_SQL_INNER);
    const run = d.lastRun;
    if (run && run.error && /API_KEY/.test(run.error) && !d.vessels.length) {
      $("aisStatus").textContent = "waiting for AIS API key"; return;
    }
    ais = cleanAis(d.vessels);
    allyAis = cleanAis(d.allied || []);
    fillAllyCountries(); shipCounts();
    draw();
    const t = run ? new Date(run.ranAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "–";
    $("aisStatus").textContent = `${ais.length} ship${ais.length === 1 ? "" : "s"} · updated ${t}`;
  } catch (e) {
    const code = (e && (e.code || e.name)) || "unknown";
    if (e && e.retryable && !loadAis.retried) {
      loadAis.retried = true;
      setTimeout(() => { loadAis(); }, Math.min(e.retryAfterMs || 3000, 15000) + Math.random() * 1000);
      $("aisStatus").textContent = "retrying…"; return;
    }
    loadAis.retried = false;
    const msgs = {
      approval_required: ["Supabase needs your OK", true],
      not_in_manifest: ["Supabase not allowed for this page", true],
      upstream_error: ["Supabase didn't answer", true],
      server_unavailable: ["Supabase busy, try again", true],
      server_not_connected: ["Connect Supabase in claude.ai Settings → Connectors", false],
      needs_reauth: ["Reconnect Supabase in claude.ai Settings → Connectors", false],
      selection_required: ["Pick which Supabase connection to use", true],
      not_granted: ["Connectors not available in this view", false],
      capability_disabled: ["Connectors not available in this view", false],
      tool_error: [`Supabase query failed: ${String(e.message || "").slice(0, 80)}`, true],
      parse_error: [`Couldn't read Supabase reply: ${String(e.message || "").replace("Unrecognized Supabase reply: ", "").slice(0, 90)}`, true],
    };
    const [text, retry] = msgs[code] || [`live feed error (${code})`, true];
    $("aisStatus").innerHTML = esc(text) + (retry ? ` <button class="retry" id="aisRetry">Tap to load</button>` : "");
    const b = $("aisRetry"); if (b) b.onclick = (ev) => { ev.stopPropagation(); loadAis(); };
    console.warn("AIS load failed", code, e && e.message);
  }
}
loadAis();
setInterval(loadAis, 5 * 60 * 1000);
</script>
